<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2d0a0a"/>
      <stop offset="100%" style="stop-color:#7f1d1d"/>
    </linearGradient>
    <linearGradient id="top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#dc2626"/>
      <stop offset="100%" style="stop-color:#991b1b"/>
    </linearGradient>
    <linearGradient id="body" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#450a0a"/>
      <stop offset="100%" style="stop-color:#1c0a0a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" style="stop-color:#dc262644"/>
      <stop offset="100%" style="stop-color:#dc262600"/>
    </radialGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- Glow -->
  <ellipse cx="100" cy="80" rx="90" ry="80" fill="url(#glow)"/>
  <!-- Case body -->
  <rect x="45" y="50" width="110" height="130" rx="20" ry="20" fill="url(#body)" stroke="#dc2626" stroke-width="2" filter="url(#shadow)"/>
  <!-- Case lid (top rounded part) -->
  <path d="M45 70 Q45 50 65 50 L135 50 Q155 50 155 70 L155 85 L45 85 Z" fill="url(#top)" stroke="#dc2626" stroke-width="2"/>
  <!-- Lock mechanism -->
  <rect x="85" y="65" width="30" height="25" rx="6" fill="#1c0a0a" stroke="#dc2626" stroke-width="1.5"/>
  <circle cx="100" cy="77" r="5" fill="#dc2626"/>
  <!-- Horizontal bands -->
  <rect x="50" y="100" width="100" height="4" rx="2" fill="#dc262644"/>
  <rect x="50" y="130" width="100" height="4" rx="2" fill="#dc262644"/>
  <rect x="50" y="155" width="100" height="4" rx="2" fill="#dc262644"/>
  <!-- Covert star markers -->
  <text x="100" y="175" font-size="10" fill="#dc2626" text-anchor="middle" font-family="Arial" font-weight="bold">★★★</text>
  <!-- Bottom feet -->
  <rect x="60" y="175" width="15" height="8" rx="3" fill="#1c0a0a" stroke="#dc2626" stroke-width="1"/>
  <rect x="125" y="175" width="15" height="8" rx="3" fill="#1c0a0a" stroke="#dc2626" stroke-width="1"/>
</svg>

