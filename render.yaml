# ============================================================
# SKINMARKET ES - Render Blueprint (Automated Infrastructure)
# ============================================================
# This file defines the entire infrastructure for Render:
#   - PostgreSQL Managed Database
#   - Backend Web Service (Express + Socket.io + Steam Bot)
#   - Frontend Static Site (React / Vite + SPA Routing)
#
# When you connect this repo to Render, all 3 services
# are provisioned automatically — no manual setup needed!
# ============================================================

# ─────────────────────────────────────────────────────────────
# 1. PostgreSQL Managed Database
# ─────────────────────────────────────────────────────────────
databases:
  - name: skinmarket-db
    databaseName: skinmarket
    user: skinmarket_user
    plan: free
    ipAllowList: [] # 0.0.0.0/0 — allow all (Render internal connections are secure)

# ─────────────────────────────────────────────────────────────
# 2. Backend Web Service (Node.js + Socket.io + BotEngine)
# ─────────────────────────────────────────────────────────────
services:
  - type: web
    name: skinmarket-backend
    env: node
    region: frankfurt # EU region for low latency to Steam
    plan: free
    buildCommand: cd src/backend && npm install
    startCommand: bash scripts/render-start.sh
    healthCheckPath: /api/bot/status
    autoDeploy: true
    envVars:
      # ── Node Environment ──
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"

      # ── Database (auto-linked from skinmarket-db) ──
      - key: DATABASE_URL
        fromDatabase:
          name: skinmarket-db
          property: connectionString

      # ── Security ──
      - key: JWT_SECRET
        generateValue: true

      # ── URLs ──
      - key: BACKEND_URL
        fromService:
          type: web
          name: skinmarket-backend
          property: url
      - key: FRONTEND_URL
        fromService:
          type: web
          name: skinmarket-frontend
          property: url

      # ── Steam (user must configure these in Render Dashboard) ──
      - key: STEAM_API_KEY
        value: TU_STEAM_API_KEY_AQUI
      - key: BOT_USERNAME
        value: tu_usuario_steam
      - key: BOT_PASSWORD
        value: tu_contraseña_steam
      - key: BOT_SHARED_SECRET
        value: tu_shared_secret
      - key: BOT_IDENTITY_SECRET
        value: tu_identity_secret

# ─────────────────────────────────────────────────────────────
# 3. Frontend Static Site (React / Vite)
# ─────────────────────────────────────────────────────────────
  - type: web
    name: skinmarket-frontend
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: skinmarket-backend
          property: url
      - key: VITE_WS_URL
        fromService:
          type: web
          name: skinmarket-backend
          property: url

