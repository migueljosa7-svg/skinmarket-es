version: '3.8'

# ============================================================
# SKINMARKET ES - PRODUCTION DEPLOYMENT
# ============================================================
# Usage: docker-compose --env-file .env up -d --build
# Make sure .env file exists in project root with all variables

services:
  # ----------------------------------------------------------
  # PostgreSQL Database
  # ----------------------------------------------------------
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    container_name: skinmarket-db
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: ${DB_NAME:-skinmarket}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    ports:
      - "127.0.0.1:5432:5432"  # Only localhost access for security
    networks:
      - skinmarket-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-skinmarket}"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # ----------------------------------------------------------
  # Redis Cache & Session Store
  # ----------------------------------------------------------
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    container_name: skinmarket-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-}
    env_file:
      - .env
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"  # Only localhost access
    networks:
      - skinmarket-net
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  # ----------------------------------------------------------
  # Nginx Reverse Proxy + SSL
  # ----------------------------------------------------------
  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    container_name: skinmarket-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro          # SSL certificates (Let's Encrypt)
      - ./data/certbot/www:/var/www/certbot:ro  # For Certbot challenges
    depends_on:
      - app
    networks:
      - skinmarket-net
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M

  # ----------------------------------------------------------
  # Certbot (SSL Auto-Renewal)
  # ----------------------------------------------------------
  certbot:
    image: certbot/certbot:latest
    container_name: skinmarket-certbot
    volumes:
      - ./ssl:/etc/letsencrypt
      - ./data/certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done;'"
    networks:
      - skinmarket-net
    profiles:
      - certbot  # Only runs when explicitly started: docker-compose --profile certbot up -d

  # ----------------------------------------------------------
  # Main Application (Backend API + Socket.io)
  # ----------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    container_name: skinmarket-app
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:?}@db:5432/${DB_NAME:-skinmarket}
      REDIS_URL: redis://:${REDIS_PASSWORD:-}@redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      FRONTEND_URL: ${DOMAIN:-https://yourdomain.com}
      BACKEND_URL: ${DOMAIN:-https://yourdomain.com}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      STEAM_API_KEY: ${STEAM_API_KEY:?STEAM_API_KEY is required}
      BOT_USERNAME: ${BOT_USERNAME:-}
      BOT_PASSWORD: ${BOT_PASSWORD:-}
      BOT_SHARED_SECRET: ${BOT_SHARED_SECRET:-}
      BOT_IDENTITY_SECRET: ${BOT_IDENTITY_SECRET:-}
    ports:
      - "127.0.0.1:3001:3001"  # Only accessible via Nginx
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - skinmarket-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

# ============================================================
# Volumes
# ============================================================
volumes:
  postgres_data:
    driver: local
    name: skinmarket_postgres_data
  redis_data:
    driver: local
    name: skinmarket_redis_data

# ============================================================
# Networks
# ============================================================
networks:
  skinmarket-net:
    driver: bridge
    name: skinmarket_network

