<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2e1065"/>
      <stop offset="100%" style="stop-color:#5b21b6"/>
    </linearGradient>
    <linearGradient id="top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a855f7"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
    <linearGradient id="body" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3b0764"/>
      <stop offset="100%" style="stop-color:#1e1b4b"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" style="stop-color:#a855f744"/>
      <stop offset="100%" style="stop-color:#a855f700"/>
    </radialGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <ellipse cx="100" cy="80" rx="90" ry="80" fill="url(#glow)"/>
  <rect x="45" y="50" width="110" height="130" rx="20" ry="20" fill="url(#body)" stroke="#a855f7" stroke-width="2" filter="url(#shadow)"/>
  <path d="M45 70 Q45 50 65 50 L135 50 Q155 50 155 70 L155 85 L45 85 Z" fill="url(#top)" stroke="#a855f7" stroke-width="2"/>
  <!-- Knife symbol -->
  <path d="M85 75 L115 85 L115 105 L100 95 L85 105 Z" fill="#1e1b4b" stroke="#a855f7" stroke-width="1"/>
  <line x1="100" y1="80" x2="100" y2="95" stroke="#a855f7" stroke-width="1.5"/>
  <!-- Lock -->
  <rect x="85" y="62" width="30" height="20" rx="5" fill="#1e1b4b" stroke="#a855f7" stroke-width="1.5"/>
  <circle cx="100" cy="72" r="4" fill="#a855f7"/>
  <!-- Bands -->
  <rect x="50" y="100" width="100" height="3" rx="1.5" fill="#a855f744"/>
  <rect x="50" y="130" width="100" height="3" rx="1.5" fill="#a855f744"/>
  <rect x="50" y="155" width="100" height="3" rx="1.5" fill="#a855f744"/>
  <!-- Knife text -->
  <text x="100" y="175" font-size="9" fill="#a855f7" text-anchor="middle" font-family="Arial" font-weight="bold">⚔ KNIFE</text>
  <rect x="60" y="175" width="15" height="8" rx="3" fill="#1e1b4b" stroke="#a855f7" stroke-width="1"/>
  <rect x="125" y="175" width="15" height="8" rx="3" fill="#1e1b4b" stroke="#a855f7" stroke-width="1"/>
</svg>

