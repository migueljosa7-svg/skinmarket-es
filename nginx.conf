# ============================================================
# SKINMARKET ES - NGINX PRODUCTION CONFIGURATION
# ============================================================
# HTTPS + WebSocket + Security Headers
# Replace yourdomain.com with your actual domain

# Upstream definitions
upstream backend {
    server app:3001;
    keepalive 64;
}

# ----------------------------------------------------------
# HTTP -> HTTPS Redirect (port 80)
# ----------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com;  # <-- CAMBIAR POR TU DOMINIO

    # Certbot challenge directory (Let's Encrypt)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ----------------------------------------------------------
# HTTPS Server (port 443)
# ----------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name yourdomain.com;  # <-- CAMBIAR POR TU DOMINIO

    # SSL Certificates (Let's Encrypt)
    ssl_certificate /etc/nginx/ssl/live/yourdomain.com/fullchain.pem;  # <-- CAMBIAR
    ssl_certificate_key /etc/nginx/ssl/live/yourdomain.com/privkey.pem; # <-- CAMBIAR

    # SSL Configuration (Mozilla Intermediate)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # SSL Session Cache
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # ----------------------------------------------------------
    # SECURITY HEADERS
    # ----------------------------------------------------------

    # HSTS (HTTP Strict Transport Security) - 630 days (recommended)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Prevent MIME type sniffing
    add_header X-Content-Type-Options "nosniff" always;

    # Clickjacking protection
    add_header X-Frame-Options "DENY" always;

    # XSS Protection (legacy browsers)
    add_header X-XSS-Protection "1; mode=block" always;

    # Referrer Policy
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Permissions Policy (restrict browser features)
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Content Security Policy
    # Allows: self, Steam CDN images, WebSocket connections
    add_header Content-Security-Policy "
        default-src 'self';
        script-src 'self' 'unsafe-inline' 'unsafe-eval';
        style-src 'self' 'unsafe-inline';
        img-src 'self' data: https://steamcommunity-a.akamaihd.net https://community.cloudflare.steamstatic.com https://steamuserimages-a.akamaihd.net;
        font-src 'self' data:;
        connect-src 'self' https://api.steampowered.com https://steamcommunity.com wss://yourdomain.com ws://localhost:*;
        frame-src 'none';
        object-src 'none';
        base-uri 'self';
        form-action 'self';
    " always;

    # ----------------------------------------------------------
    # GZIP Compression
    # ----------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        application/rss+xml
        application/xml
        image/svg+xml
        text/css
        text/html
        text/plain
        text/xml;

    # ----------------------------------------------------------
    # Client Body Size (for file uploads, if needed)
    # ----------------------------------------------------------
    client_max_body_size 10M;

    # ----------------------------------------------------------
    # LOGGING
    # ----------------------------------------------------------
    access_log /var/log/nginx/skinmarket-access.log;
    error_log /var/log/nginx/skinmarket-error.log warn;

    # ----------------------------------------------------------
    # STATIC FILES (Frontend - served directly by Nginx)
    # ----------------------------------------------------------
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;

        # Cache static assets aggressively
        location ~* \.(?:css|js|woff2?|svg|png|jpg|jpeg|gif|ico|webp)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Don't cache HTML
        location ~* \.html$ {
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        }
    }

    # ----------------------------------------------------------
    # API PROXY (Backend Express)
    # ----------------------------------------------------------
    location /api/ {
        proxy_pass http://backend/;
        proxy_http_version 1.1;

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Disable buffering for real-time responses
        proxy_buffering off;
        proxy_request_buffering off;

        # Timeouts
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # Remove /api prefix when forwarding to backend
        rewrite ^/api/(.*) /$1 break;
    }

    # ----------------------------------------------------------
    # SOCKET.IO (WebSocket) PROXY
    # ----------------------------------------------------------
    location /socket.io/ {
        proxy_pass http://backend/socket.io/;
        proxy_http_version 1.1;

        # WebSocket support (CRITICAL for Socket.io)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering for real-time
        proxy_buffering off;
        proxy_request_buffering off;

        # Long timeout for WebSocket connections
        proxy_connect_timeout 10s;
        proxy_send_timeout 86400s;   # 24 hours
        proxy_read_timeout 86400s;   # 24 hours

        # Allow unlimited request body for long-lived connections
        client_max_body_size 0;
    }

    # ----------------------------------------------------------
    # HEALTH CHECK (optional - for load balancers)
    # ----------------------------------------------------------
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # ----------------------------------------------------------
    # DENY ACCESS to sensitive paths
    # ----------------------------------------------------------
    location ~ /\.(env|git|htaccess|htpasswd|svn|DS_Store) {
        deny all;
        return 404;
    }

    location ~ \.json$ {
        # Only allow specific JSON files needed by frontend
        allow all;
    }
}

