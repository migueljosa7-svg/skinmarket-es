<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0500"/>
      <stop offset="100%" style="stop-color:#431407"/>
    </linearGradient>
    <linearGradient id="top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f97316"/>
      <stop offset="100%" style="stop-color:#ea580c"/>
    </linearGradient>
    <linearGradient id="body" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#431407"/>
      <stop offset="100%" style="stop-color:#1a0500"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" style="stop-color:#f9731644"/>
      <stop offset="100%" style="stop-color:#f9731600"/>
    </radialGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <linearGradient id="fire" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f97316"/>
      <stop offset="50%" style="stop-color:#fbbf24"/>
      <stop offset="100%" style="stop-color:#ef4444"/>
    </linearGradient>
  </defs>
  <ellipse cx="100" cy="80" rx="90" ry="80" fill="url(#glow)"/>
  <rect x="45" y="50" width="110" height="130" rx="20" ry="20" fill="url(#body)" stroke="url(#fire)" stroke-width="2.5" filter="url(#shadow)"/>
  <path d="M45 70 Q45 50 65 50 L135 50 Q155 50 155 70 L155 85 L45 85 Z" fill="url(#top)" stroke="url(#fire)" stroke-width="2.5"/>
  <!-- Legendary flame symbol -->
  <path d="M100 58 Q90 65 92 75 Q88 72 85 78 Q90 82 95 80 Q92 88 100 92 Q108 88 105 80 Q110 82 115 78 Q112 72 108 75 Q110 65 100 58Z" fill="#1a0500" stroke="url(#fire)" stroke-width="1.5"/>
  <!-- Lock -->
  <rect x="85" y="110" width="30" height="20" rx="5" fill="#1a0500" stroke="url(#fire)" stroke-width="1.5"/>
  <circle cx="100" cy="120" r="4" fill="url(#fire)"/>
  <!-- Bands with gradient -->
  <rect x="50" y="138" width="100" height="3" rx="1.5" fill="#f9731644"/>
  <rect x="50" y="160" width="100" height="3" rx="1.5" fill="#f9731644"/>
  <!-- Legendary text -->
  <text x="100" y="178" font-size="7" fill="url(#fire)" text-anchor="middle" font-family="Arial" font-weight="bold">LEGENDARY</text>
  <rect x="60" y="175" width="15" height="8" rx="3" fill="#1a0500" stroke="url(#fire)" stroke-width="1"/>
  <rect x="125" y="175" width="15" height="8" rx="3" fill="#1a0500" stroke="url(#fire)" stroke-width="1"/>
</svg>

