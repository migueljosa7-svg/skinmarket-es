# ============================================================
# SKINMARKET ES - Render Blueprint (Automated Infrastructure)
# ============================================================
# Infrastructure definition for Render:
#   - PostgreSQL Managed Database
#   - Backend Web Service (Express + Socket.io + Steam Bot)
#   - Frontend Static Site (React / Vite + SPA Routing)
# ============================================================

# ─────────────────────────────────────────────────────────────
# 1. PostgreSQL Managed Database
# ─────────────────────────────────────────────────────────────
databases:
  - name: skinmarket-db
    databaseName: skinmarket
    user: skinmarket_user
    plan: free
    ipAllowList: [] # Allow internal access

# ─────────────────────────────────────────────────────────────
# 2. Backend Web Service (Node.js + Socket.io + BotEngine)
# ─────────────────────────────────────────────────────────────
services:
  - type: web
    name: skinmarket-backend
    env: node
    rootDir: .
    region: frankfurt # EU region for low latency to Steam
    plan: free
    buildCommand: |
      if [ -f backend/package.json ]; then
        cd backend && npm install
      elif [ -f src/backend/package.json ]; then
        cd src/backend && npm install
      elif [ -f ../src/backend/package.json ]; then
        cd ../src/backend && npm install
      else
        echo "ERROR: Cannot find backend package.json"
        exit 1
      fi
    startCommand: |
      if [ -f scripts/render-start.sh ]; then
        bash scripts/render-start.sh
      elif [ -f ../scripts/render-start.sh ]; then
        bash ../scripts/render-start.sh
      elif [ -f ../../scripts/render-start.sh ]; then
        bash ../../scripts/render-start.sh
      else
        echo "ERROR: render-start.sh not found"
        exit 1
      fi
    healthCheckPath: /api/bot/status
    autoDeploy: true
    envVars:
      # ── Node Environment ──
      - key: NODE_ENV
        value: production

      # Render injects the runtime PORT automatically. Do not hardcode it here.
      # The app also falls back to 3001 for local development.

      # ── Backend / Frontend URLs ──
      - key: BACKEND_URL
        value: "https://your-backend-service.onrender.com"
      - key: FRONTEND_URL
        value: "https://your-frontend-service.onrender.com"

      # ── Database (auto-linked from skinmarket-db) ──
      - key: DATABASE_URL
        fromDatabase:
          name: skinmarket-db
          property: connectionString

      # ── Security ──
      - key: JWT_SECRET
        generateValue: true

      # ── Google OAuth ──
      - key: GOOGLE_CLIENT_ID
        value: "your-google-client-id.apps.googleusercontent.com"
      - key: VITE_GOOGLE_CLIENT_ID
        value: "your-google-client-id.apps.googleusercontent.com"

      # ── Steam Credentials (Configurar en el Dashboard de Render) ──
      - key: STEAM_API_KEY
        value: TU_STEAM_API_KEY_AQUI
      - key: STEAM_REALM
        value: "https://skinmarket-backend.onrender.com/"
      - key: STEAM_RETURN_URL
        value: "https://skinmarket-backend.onrender.com/api/auth/steam/return"
      - key: BOT_USERNAME
        value: tu_usuario_steam
      - key: BOT_PASSWORD
        value: tu_contraseña_steam
      - key: BOT_SHARED_SECRET
        value: tu_shared_secret
      - key: BOT_IDENTITY_SECRET
        value: tu_identity_secret

# ─────────────────────────────────────────────────────────────
# 3. Frontend Static Site (React / Vite)
# ─────────────────────────────────────────────────────────────
  - type: web
    name: skinmarket-frontend
    env: static
    rootDir: .
    buildCommand: |
      if [ -f package.json ]; then
        npm install && npm run build
      elif [ -f ../package.json ]; then
        cd .. && npm install && npm run build
      else
        echo "ERROR: Cannot find root package.json"
        exit 1
      fi
    staticPublishPath: ./dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: "https://your-backend-service.onrender.com"
      - key: VITE_WS_URL
        value: "https://your-backend-service.onrender.com"
      - key: VITE_BACKEND_URL
        value: "https://your-backend-service.onrender.com"
      - key: VITE_GOOGLE_CLIENT_ID
        value: "your-google-client-id.apps.googleusercontent.com"
